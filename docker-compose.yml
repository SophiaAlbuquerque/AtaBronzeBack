version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: atabrinze-postgres
    environment:
      POSTGRES_DB: atabrinze_db
      POSTGRES_USER: atabrinze_user
      POSTGRES_PASSWORD: atabrinze_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atabrinze-network

  # Atabrinze API
  api:
    build: .
    container_name: atabrinze-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:./data/prod.db
      JWT_SECRET: production-secret-change-this-in-deployment
      JWT_EXPIRES_IN: 7d
      BLING_API_KEY: your-bling-api-key
      BLING_API_URL: https://api.bling.com.br/Api/v3
      ASAAS_API_KEY: your-asaas-api-key
      ASAAS_API_URL: https://api.asaas.com/v3
      ASAAS_SANDBOX: "false"
      CORREIOS_API_URL: https://cep.correios.com.br/api/v2
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
      - api_data:/app/data
    networks:
      - atabrinze-network
    restart: unless-stopped

  # Redis (for future caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: atabrinze-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - atabrinze-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  api_data:

networks:
  atabrinze-network:
    driver: bridge
