version: '3.8'

services:
  # Atabrinze API (standalone with SQLite)
  api:
    build: .
    container_name: atabrinze-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:./data/prod.db
      JWT_SECRET: production-secret-change-this-in-deployment
      JWT_EXPIRES_IN: 7d
      BLING_API_KEY: your-bling-api-key
      BLING_API_URL: https://api.bling.com.br/Api/v3
      ASAAS_API_KEY: your-asaas-api-key
      ASAAS_API_URL: https://api.asaas.com/v3
      ASAAS_SANDBOX: "false"
      CORREIOS_API_URL: https://cep.correios.com.br/api/v2
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
      - api_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

volumes:
  api_data:
